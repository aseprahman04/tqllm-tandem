<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-label="Tandem: tqLLM across two GPUs, 524K context for Qwen3.8-27B">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b16"/>
      <stop offset="0.55" stop-color="#0d1730"/>
      <stop offset="1" stop-color="#160d2e"/>
    </linearGradient>
    <linearGradient id="cardA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b2a4d"/>
      <stop offset="1" stop-color="#0f1a33"/>
    </linearGradient>
    <linearGradient id="link" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e0f2fe"/>
      <stop offset="0.5" stop-color="#7dd3fc"/>
      <stop offset="1" stop-color="#c4b5fd"/>
    </linearGradient>
    <radialGradient id="glowC" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowV" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#a855f7" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1280" height="420" fill="url(#bg)"/>
  <rect width="1280" height="420" fill="url(#grid)"/>

  <!-- the two cards -->
  <g transform="translate(70,96)">
    <ellipse cx="120" cy="114" rx="170" ry="120" fill="url(#glowC)"/>
    <rect x="0" y="40" width="240" height="150" rx="16" fill="url(#cardA)" stroke="#22d3ee" stroke-opacity="0.7" stroke-width="2"/>
    <g fill="#22d3ee" fill-opacity="0.18">
      <rect x="18" y="58" width="96" height="114" rx="8"/>
      <rect x="126" y="58" width="96" height="114" rx="8"/>
    </g>
    <g stroke="#22d3ee" stroke-opacity="0.55" stroke-width="2" fill="none">
      <circle cx="66" cy="115" r="34"/><circle cx="66" cy="115" r="12"/>
      <circle cx="174" cy="115" r="34"/><circle cx="174" cy="115" r="12"/>
    </g>
    <g fill="#22d3ee" fill-opacity="0.8">
      <rect x="20" y="190" width="10" height="12" rx="2"/><rect x="38" y="190" width="10" height="12" rx="2"/>
      <rect x="56" y="190" width="10" height="12" rx="2"/><rect x="74" y="190" width="10" height="12" rx="2"/>
      <rect x="92" y="190" width="10" height="12" rx="2"/><rect x="110" y="190" width="10" height="12" rx="2"/>
    </g>
    <text x="120" y="26" text-anchor="middle" font-family="'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600" fill="#67e8f9" letter-spacing="2">GPU 1 · LAYERS 0 – K</text>
  </g>

  <g transform="translate(970,96)">
    <ellipse cx="120" cy="114" rx="170" ry="120" fill="url(#glowV)"/>
    <rect x="0" y="40" width="240" height="150" rx="16" fill="url(#cardA)" stroke="#a855f7" stroke-opacity="0.75" stroke-width="2"/>
    <g fill="#a855f7" fill-opacity="0.2">
      <rect x="18" y="58" width="96" height="114" rx="8"/>
      <rect x="126" y="58" width="96" height="114" rx="8"/>
    </g>
    <g stroke="#c084fc" stroke-opacity="0.6" stroke-width="2" fill="none">
      <circle cx="66" cy="115" r="34"/><circle cx="66" cy="115" r="12"/>
      <circle cx="174" cy="115" r="34"/><circle cx="174" cy="115" r="12"/>
    </g>
    <g fill="#c084fc" fill-opacity="0.85">
      <rect x="20" y="190" width="10" height="12" rx="2"/><rect x="38" y="190" width="10" height="12" rx="2"/>
      <rect x="56" y="190" width="10" height="12" rx="2"/><rect x="74" y="190" width="10" height="12" rx="2"/>
      <rect x="92" y="190" width="10" height="12" rx="2"/><rect x="110" y="190" width="10" height="12" rx="2"/>
    </g>
    <text x="120" y="26" text-anchor="middle" font-family="'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600" fill="#d8b4fe" letter-spacing="2">GPU 0 · LAYERS K – 63 · HEAD</text>
  </g>

  <!-- the hand-off between them -->
  <path id="wire" d="M318 211 C 470 211, 520 300, 640 300 S 810 211, 962 211" fill="none" stroke="url(#link)" stroke-width="3" stroke-opacity="0.85"/>
  <path d="M318 211 C 470 211, 520 300, 640 300 S 810 211, 962 211" fill="none" stroke="url(#link)" stroke-width="12" stroke-opacity="0.12"/>
  <g>
    <circle r="5" fill="#e0f2fe">
      <animateMotion dur="2.4s" repeatCount="indefinite"><mpath href="#wire"/></animateMotion>
    </circle>
    <circle r="5" fill="#e0f2fe">
      <animateMotion dur="2.4s" begin="0.8s" repeatCount="indefinite"><mpath href="#wire"/></animateMotion>
    </circle>
    <circle r="5" fill="#e0f2fe">
      <animateMotion dur="2.4s" begin="1.6s" repeatCount="indefinite"><mpath href="#wire"/></animateMotion>
    </circle>
  </g>
  <text x="640" y="330" text-anchor="middle" font-family="'Cascadia Code', 'JetBrains Mono', Consolas, monospace" font-size="14" fill="#94a3b8">~10 KB / token · host-staged · no NVLink</text>

  <!-- title -->
  <text x="640" y="118" text-anchor="middle" font-family="'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="92" font-weight="800" letter-spacing="14" fill="url(#title)">TANDEM</text>
  <text x="640" y="160" text-anchor="middle" font-family="'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="21" fill="#cbd5e1">tqLLM across two consumer GPUs · Qwen3.8-27B · DFlash2</text>

  <!-- stat chips -->
  <g font-family="'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="600" text-anchor="middle">
    <rect x="356" y="360" width="160" height="36" rx="18" fill="#0e7490" fill-opacity="0.35" stroke="#22d3ee" stroke-opacity="0.6"/>
    <text x="436" y="384" fill="#a5f3fc">524K context</text>
    <rect x="532" y="360" width="216" height="36" rx="18" fill="#3730a3" fill-opacity="0.35" stroke="#818cf8" stroke-opacity="0.6"/>
    <text x="640" y="384" fill="#c7d2fe">127–140 tok/s code</text>
    <rect x="764" y="360" width="160" height="36" rx="18" fill="#6b21a8" fill-opacity="0.35" stroke="#c084fc" stroke-opacity="0.6"/>
    <text x="844" y="384" fill="#e9d5ff">bit-exact split</text>
  </g>
</svg>
